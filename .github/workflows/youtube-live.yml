name: YouTube Ludo Live

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 680

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install required packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium-browser \
            ffmpeg \
            xvfb \
            pulseaudio \
            pulseaudio-utils \
            xdotool

      - name: Start virtual display and audio
        run: |
          # Start virtual display
          Xvfb :99 -screen 0 1080x1920x24 -ac &
          sleep 3
          echo "DISPLAY=:99" >> $GITHUB_ENV

          # Start PulseAudio
          pulseaudio --start --exit-idle-time=-1

          # Create virtual audio output
          pactl load-module module-null-sink \
            sink_name=VirtualSink \
            sink_properties=device.description=VirtualSink

          # Make it the default output
          pactl set-default-sink VirtualSink

          echo "PULSE_SINK=VirtualSink" >> $GITHUB_ENV

          sleep 3

      - name: Launch Ludo Game Fullscreen
        run: |
          chromium-browser \
            --no-sandbox \
            --disable-dev-shm-usage \
            --disable-gpu \
            --disable-software-rasterizer \
            --disable-infobars \
            --disable-session-crashed-bubble \
            --disable-translate \
            --no-first-run \
            --no-default-browser-check \
            --autoplay-policy=no-user-gesture-required \
            --window-position=0,0 \
            --window-size=1080,1920 \
            --start-fullscreen \
            --kiosk \
            "https://soulfulmat1.github.io/ludo-live-game/" \
            >/tmp/chromium.log 2>&1 &

          sleep 20
          # Click once to enable commentary audio
          xdotool mousemove 540 960
          xdotool click 1

          sleep 5
          

      - name: Stream Ludo Game with Audio to YouTube
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          timeout --signal=INT 40800s ffmpeg \
            -f x11grab \
            -draw_mouse 0 \
            -framerate 30 \
            -video_size 1080x1920 \
            -i :99.0+0,0 \
            -f pulse \
            -i VirtualSink.monitor \
            -map 0:v:0 \
            -map 1:a:0 \
            -c:v libx264 \
            -preset veryfast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -b:v 4500k \
            -maxrate 4500k \
            -bufsize 9000k \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -ac 2 \
            -t 11:20:00 \
            -f flv \
            "rtmp://a.rtmp.youtube.com/live2/${YOUTUBE_STREAM_KEY}"
